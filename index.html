<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Game Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #090d16; color: #fff; font-family: sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 15px; }
        h1 { font-size: 2.5rem; color: #38bdf8; margin-bottom: 10px; text-align: center; }
        p.subtitle { color: #9ca3af; margin-bottom: 30px; text-align: center; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; width: 100%; max-width: 1000px; }
        .game-card { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 20px; text-align: center; text-decoration: none; color: inherit; display: flex; flex-direction: column; justify-content: space-between; }
        .game-card:hover { border-color: #38bdf8; transform: translateY(-5px); }
        .game-icon { font-size: 3rem; margin-bottom: 10px; }
        .game-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 8px; }
        .btn-play { background: #22c55e; color: #fff; padding: 10px; border-radius: 8px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>🕹️ ARCADE GAME HUB</h1>
    <p class="subtitle">Выбирай игру и начни играть!</p>
    <div class="games-grid">
        <a href="games/arkanoid/index.html" class="game-card">
            <div><div class="game-icon">🧱</div><div class="game-title">Арканоид Deluxe</div></div>
            <div class="btn-play">Играть</div>
        </a>
        <a href="games/clicker/index.html" class="game-card">
            <div><div class="game-icon">💎</div><div class="game-title">Cyber Clicker</div></div>
            <div class="btn-play">Играть</div>
        </a>
        <a href="games/platformer/index.html" class="game-card">
            <div><div class="game-icon">🏃</div><div class="game-title">2.5D Platformer</div></div>
            <div class="btn-play">Играть</div>
        </a>
        <a href="games/snake/index.html" class="game-card">
            <div><div class="game-icon">🐍</div><div class="game-title">Змейка Deluxe</div></div>
            <div class="btn-play">Играть</div>
        </a>
        <a href="games/runner/index.html" class="game-card">
            <div><div class="game-icon">⚡</div><div class="game-title">2D Sprint Runner</div></div>
            <div class="btn-play">Играть</div>
        </a>
    </div>
</body>
</html>
