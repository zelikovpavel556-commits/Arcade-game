<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Raycast Doom Shooter</title>
    <link rel="stylesheet" href="../../shared/style.css">
    <style>
        body { background: #050505; color: #fff; text-align: center; font-family: monospace; }
        #game-container { position: relative; width: 800px; margin: 20px auto; }
        canvas { border: 2px solid #333; background: #000; box-shadow: 0 0 20px rgba(255,0,0,0.2); }
        #hud {
            position: absolute; bottom: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; background: rgba(0,0,0,0.7);
            padding: 10px 20px; border-radius: 8px; border: 1px solid #444; font-size: 18px;
        }
        .hp-bar { color: #ff4444; font-weight: bold; }
        .ammo-bar { color: #ffff44; font-weight: bold; }
    </style>
</head>
<body class="game-body">
    <div class="game-header">
        <a href="../../index.html" class="btn-back">← В меню</a>
        <h2>🔥 3D DOOM RAYCASTER (10 УРОВНЕЙ)</h2>
    </div>
    <div id="game-container">
        <canvas id="canvas" width="800" height="450"></canvas>
        <div id="hud">
            <div class="hp-bar">ЗДОРОВЬЕ: <span id="hp">100</span>%</div>
            <div>УРОВЕНЬ: <span id="lvl">1</span>/10</div>
            <div class="ammo-bar">ВРАГОВ ОСТАЛОСЬ: <span id="enemies-count">0</span></div>
        </div>
    </div>
    <p class="controls-hint">W/A/S/D или Стрелки — Перемещение | Пробел / ЛКМ — Стрельба</p>
    <script src="game.js"></script>
</body>
</html>
