<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.5D Procedural Runner Platformer</title>
    <link rel="stylesheet" href="../../shared/style.css">
    <style>
        body { background: #0b0f19; color: #fff; font-family: sans-serif; text-align: center; }
        #canvas-box { position: relative; width: 800px; margin: 0 auto; }
        canvas { border: 2px solid #334155; border-radius: 12px; background: #020617; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .hud-panel {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between;
            background: rgba(15, 23, 42, 0.85); padding: 10px 20px;
            border-radius: 8px; border: 1px solid #334155; font-weight: bold; font-size: 1.1rem;
        }
    </style>
</head>
<body class="game-body">
    <div class="game-header">
        <a href="../../index.html" class="btn-back">← В меню</a>
        <h2>🏃 2.5D PROCEDURAL PLATFORMER</h2>
    </div>

    <div id="canvas-box">
        <canvas id="canvas" width="800" height="450"></canvas>
        <div class="hud-panel">
            <div style="color: #38bdf8;">УРОВЕНЬ: <span id="lvl-val">1</span></div>
            <div style="color: #eab308;">МОНЕТЫ: <span id="coins-val">0</span></div>
            <div style="color: #22c55e;">РЕКОРД: <span id="record-val">0</span></div>
        </div>
    </div>
    <p class="controls-hint">A/D или Стрелки — Бег | W / Пробел — Прыжок | Прыгай на врагов сверху!</p>

    <script src="game.js"></script>
</body>
</html>
