<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Classic Snake Deluxe</title>
    <link rel="stylesheet" href="../../shared/style.css">
    <style>
        body { background: #0b0f19; color: #fff; font-family: sans-serif; text-align: center; touch-action: manipulation; }
        .snake-layout { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        canvas { border: 2px solid #334155; border-radius: 12px; background: #020617; max-width: 95vw; }
        .d-pad { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); gap: 5px; margin-top: 10px; }
        .btn-dir { background: #1e293b; border: 1px solid #334155; color: #fff; font-size: 1.5rem; border-radius: 10px; display: flex; align-items: center; justify-content: center; user-select: none; }
        .btn-dir:active { background: #38bdf8; color: #000; }
    </style>
</head>

<body class="game-body">
    <div class="game-header">
        <a href="../../index.html" class="btn-back">← В меню</a>
        <h2>🐍 КЛАССИЧЕСКАЯ ЗМЕЙКА</h2>
    </div>

    <div class="snake-layout">
        <div style="font-size: 1.2rem; color: #38bdf8;">
            ОЧКИ: <span id="score">0</span> | РЕКОРД: <span id="high-score">0</span>
        </div>
        <canvas id="canvas" width="360" height="360"></canvas>
        
        <!-- МОБИЛЬНОЕ УПРАВЛЕНИЕ -->
        <div class="d-pad">
            <div></div><div class="btn-dir" onclick="setDir(0, -1)">▲</div><div></div>
            <div class="btn-dir" onclick="setDir(-1, 0)">◀</div><div></div><div class="btn-dir" onclick="setDir(1, 0)">▶</div>
            <div></div><div class="btn-dir" onclick="setDir(0, 1)">▼</div><div></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
