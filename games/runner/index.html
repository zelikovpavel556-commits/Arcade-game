<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2D Sprint Runner</title>
    <link rel="stylesheet" href="../../shared/style.css">
    <style>
        body { background: #090d16; color: #fff; font-family: sans-serif; text-align: center; touch-action: none; user-select: none; }
        canvas { border: 2px solid #334155; border-radius: 12px; background: #020617; width: 100%; max-width: 800px; }
        .run-btn {
            width: 90%; max-width: 400px; height: 80px; margin: 15px auto;
            background: linear-gradient(135deg, #22c55e, #15803d);
            border: 3px solid #4ade80; border-radius: 16px; color: #fff;
            font-size: 1.8rem; font-weight: bold; cursor: pointer; display: block;
        }
        .run-btn:active { transform: scale(0.96); }
    </style>
</head>
<body class="game-body">
    <div class="game-header">
        <a href="../../index.html" class="btn-back">← В меню</a>
        <h2>🏃 2D SPRINT CHAMPIONSHIP</h2>
    </div>

    <canvas id="canvas" width="800" height="350"></canvas>
    <button id="tap-btn" class="run-btn">ЖМИ ВСЕМИ ПАЛЬЦАМИ! ⚡</button>

    <script src="game.js"></script>
</body>
</html>
